name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test repository trust policy
        if: runner.os == 'Linux'
        run: |
          node --test .github/scripts/trust-policy.test.mjs
          node .github/scripts/trust-policy.mjs .

      - name: Test release-note generator
        if: runner.os == 'Linux'
        run: bash scripts/release-notes.test.sh

      - name: Test Debian package validator
        if: runner.os == 'Linux'
        run: bash scripts/validate-debian-package.test.sh

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo scripts/linux-build-deps.sh

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-${{ matrix.os }}

      - name: Show pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Install pinned documentation tools
        run: |
          cargo install mdbook --version '=0.5.4' --locked
          cargo install mdbook-linkcheck2 --version '=0.13.0' --locked

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all --locked

      - name: Build release binary with bundled documentation
        run: cargo build --release --locked --bin eso-weave

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

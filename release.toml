# cargo-release configuration for ESO Weave.
#
# Preparing a release is `cargo release X.Y.Z --execute` on a protected-main
# release branch (see docs/project/releasing.md). That bumps the crate version
# in Cargo.toml (the single source of the app and package version), rolls
# CHANGELOG.md (renaming the Unreleased section to the versioned one and opening
# a fresh Unreleased), and commits as `release: vX.Y.Z`. It deliberately does
# not tag or push. After the reviewed commit merges and main is green, the
# maintainer creates and pushes the annotated tag that triggers
# .github/workflows/release.yml.
#
# Pinned artifact. Do not modify without a dated decision recorded in CHANGELOG.md.

allow-branch = ["codex/*-release"]
sign-commit = false
tag = false
push = false
publish = false
pre-release-commit-message = "release: v{{version}}"

# Roll CHANGELOG.md: keep a fresh "## [Unreleased]" at the top and open a new
# "## [X.Y.Z] - DATE" heading beneath it, so the previously-unreleased entries
# become the released section.
[[pre-release-replacements]]
file = "CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}"
exactly = 1

# Bump the README version badge to the release version so it never drifts. The
# badge is a static shields.io badge (version-X.Y.Z-2ea44f); this rewrites the
# version segment in place on every release.
[[pre-release-replacements]]
file = "README.md"
search = "version-[0-9]+\\.[0-9]+\\.[0-9]+-2ea44f"
replace = "version-{{version}}-2ea44f"
exactly = 1

# Advance the bundled documentation snapshot with the same version and date as
# the crate and changelog. The documentation policy rejects either value when it
# drifts from those authorities.
[[pre-release-replacements]]
file = "docs/src/README.md"
search = "<dt>Applies to</dt>\\s*<dd>v[0-9]+\\.[0-9]+\\.[0-9]+</dd>"
replace = "<dt>Applies to</dt>\n    <dd>v{{version}}</dd>"
exactly = 1

[[pre-release-replacements]]
file = "docs/src/README.md"
search = "<dt>Released</dt>\\s*<dd><time datetime=\"[0-9]{4}-[0-9]{2}-[0-9]{2}\">[0-9]{4}-[0-9]{2}-[0-9]{2}</time></dd>"
replace = "<dt>Released</dt>\n    <dd><time datetime=\"{{date}}\">{{date}}</time></dd>"
exactly = 1

# Keep the committed collector-capture request valid against the importer,
# which records the package version that produced its normalized catalog.
[[pre-release-replacements]]
file = "specs/073-reviewed-catalog-pipeline/fixtures/capture-request.json"
search = "\"tool_version\": \"[0-9]+\\.[0-9]+\\.[0-9]+\""
replace = "\"tool_version\": \"{{version}}\""
exactly = 1

[package]
name = "eso-weave"
version = "0.16.0"
edition = "2021"
rust-version = "1.96"
description = "Desktop companion application for The Elder Scrolls Online."
license = "Apache-2.0"
repository = "https://github.com/h8rt3rmin8r/eso-weave"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
dirs = "7"
time = { version = "0.3", features = ["formatting"] }
thiserror = "2"
rusqlite = { version = "0.40.2", default-features = false, features = ["backup", "bundled"] }
sha2 = "0.11"
tempfile = "3"
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
image_dds = { version = "0.7.2", default-features = false, features = [
    "ddsfile",
    "image",
] }
# Blocking HTTPS client (rustls TLS, no async runtime) for the startup ESO API
# version check. Not a pinned artifact; the added networked dependency is recorded
# as a dated decision in CHANGELOG.md.
ureq = "3"
# Local extension service stack selected and reviewed in ADR 0002. Exact pins
# keep the external transport contract stable across feature slices.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { version = "=1.53.1", features = ["net", "rt", "sync", "time"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"
x11rb = "0.14"

# Embeds the application icon into the Windows executable at build time. Only a
# build dependency on Windows hosts; the Linux build never pulls or runs it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Runs S107 contract tests through RMCP's official client and Streamable HTTP
# transport. Release builds retain the server-only dependency feature set.
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
# Headless egui harness for the rendered-frame sizing tests (slice 030). Zero
# features are enabled by default, so no GPU, windowing, or image stack enters the
# test build; the version tracks the eframe/egui release. Recorded as a dated
# decision in CHANGELOG.md.
egui_kittest = { version = "0.36.1", default-features = false }
# Headless documentation capture uses egui's own renderer directly so GPU setup
# remains explicit. These dependencies remain test-only and never enter release builds.
egui-wgpu = { version = "0.36.1", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "dx12", "vulkan", "gles"] }
pollster = "1.0"
# Executes the exact encounter addon under ESO-compatible Lua 5.1 semantics.
# Vendoring keeps the privacy and loss state-machine tests deterministic on both
# CI platforms without adding Lua to the shipped application.
mlua = { version = "0.12", features = ["lua51", "vendored"] }

[[test]]
name = "documentation_capture"
path = "tests/documentation_capture.rs"
harness = false

# Debian package metadata for cargo-deb (built by the pinned release pipeline with
# `cargo deb --no-build`). Pinned packaging config: changes are recorded as dated
# decisions in CHANGELOG.md.
[package.metadata.deb]
maintainer = "h8rt3rmin8r <46768484+h8rt3rmin8r@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """
ESO Weave is a desktop companion for The Elder Scrolls Online. It runs entirely
outside the game: an input engine intercepts and synthesizes keys while the game
window is focused, a weave engine executes combat action sequences, and an optional
fishing module reads a pixel-bus signal from the embedded PixelBeacon addon.

Linux input interception needs access to input devices. Add your user to the
"input" group, or rely on the packaged udev rule for /dev/uinput. See the README
under /usr/share/doc/eso-weave/ for details.
"""
assets = [
    ["target/release/eso-weave", "usr/bin/", "755"],
    ["packaging/linux/eso-weave.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/eso-weave.png", "usr/share/icons/hicolor/256x256/apps/eso-weave.png", "644"],
    ["packaging/linux/70-eso-weave-uinput.rules", "usr/lib/udev/rules.d/70-eso-weave-uinput.rules", "644"],
    ["assets/catalog/catalog.sqlite", "usr/share/eso-weave/catalog/catalog.sqlite", "644"],
    ["README.md", "usr/share/doc/eso-weave/README.md", "644"],
]

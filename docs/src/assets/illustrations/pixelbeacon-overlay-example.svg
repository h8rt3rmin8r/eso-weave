<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">Synthetic PixelBeacon overlay placement example</title>
  <desc id="description">A simplified game-window frame with a row of colored PixelBeacon cells anchored at the top-left and a callout warning that other interface elements must not cover them.</desc>
  <rect width="960" height="480" rx="24" fill="#0e1116"/>
  <rect x="32" y="38" width="896" height="404" rx="14" fill="#151b23" stroke="#65758b" stroke-width="3"/>
  <path d="M32 90h896" stroke="#65758b" stroke-width="3"/>
  <circle cx="58" cy="64" r="8" fill="#ff7479"/>
  <circle cx="84" cy="64" r="8" fill="#f2b03c"/>
  <circle cx="110" cy="64" r="8" fill="#2dd4bf"/>
  <text x="480" y="70" fill="#e6edf3" font-family="Inter, Segoe UI, sans-serif" font-size="23" text-anchor="middle">Synthetic game-window example</text>
  <g transform="translate(44 104)">
    <rect width="28" height="28" fill="#f2b03c"/>
    <rect x="28" width="28" height="28" fill="#2dd4bf"/>
    <rect x="56" width="28" height="28" fill="#ff7479"/>
    <rect x="84" width="28" height="28" fill="#6ba8ff"/>
    <rect x="112" width="28" height="28" fill="#9b87f5"/>
    <rect x="140" width="28" height="28" fill="#e6edf3"/>
    <rect x="168" width="28" height="28" fill="#f2b03c"/>
    <rect x="196" width="28" height="28" fill="#2dd4bf"/>
    <rect x="224" width="28" height="28" fill="#ff7479"/>
    <rect x="252" width="28" height="28" fill="#6ba8ff"/>
    <rect x="280" width="28" height="28" fill="#9b87f5"/>
    <rect x="308" width="28" height="28" fill="#e6edf3"/>
  </g>
  <path d="M360 118h170c38 0 54 20 54 52v34" fill="none" stroke="#f2b03c" stroke-width="5" stroke-linecap="round"/>
  <path d="M572 196l12 18 12-18" fill="none" stroke="#f2b03c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="474" y="220" width="404" height="150" rx="12" fill="#0e1116" stroke="#f2b03c" stroke-width="3"/>
  <text x="498" y="256" fill="#f2b03c" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="600">PIXELBEACON: SYNTHETIC EXAMPLE</text>
  <text x="498" y="292" fill="#e6edf3" font-family="Inter, Segoe UI, sans-serif" font-size="19">The color grid stays at the top-left origin.</text>
  <text x="498" y="324" fill="#e6edf3" font-family="Inter, Segoe UI, sans-serif" font-size="19">Keep game UI and overlays from covering its cells.</text>
  <text x="498" y="354" fill="#8b97a7" font-family="Inter, Segoe UI, sans-serif" font-size="16">Colors illustrate telemetry cells; this is not live gameplay.</text>
  <text x="54" y="414" fill="#8b97a7" font-family="Inter, Segoe UI, sans-serif" font-size="17">Top-left anchor is part of the reader and addon protocol.</text>
</svg>

<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3"><tspan x="200" y="44">Catalog evidence</tspan> <tspan x="200" y="78">lifecycle</tspan></text>
<rect data-node="sources" data-stage="1" x="20" y="132" width="360" height="244" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="sources"><tspan x="200" y="174">Packaged baseline</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="sources"><tspan x="200" y="208">Starting data</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="sources"><tspan x="200" y="242">Pinned sources</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="sources"><tspan x="200" y="276">Exact version</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="sources"><tspan x="200" y="310">Rights retained</tspan></text>

<rect data-node="collector" data-stage="1" x="20" y="446" width="360" height="244" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="collector"><tspan x="200" y="488">Automatic</tspan> <tspan x="200" y="522">collection</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="collector"><tspan x="200" y="556">API definitions</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="collector"><tspan x="200" y="590">Complete snapshot</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="collector"><tspan x="200" y="624">ESO controls saves</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="collector"><tspan x="200" y="658">Local-only values</tspan></text>

<rect data-node="normalized" data-stage="2" x="20" y="760" width="360" height="244" rx="8" fill="#172b3a" stroke="#2dd4bf" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="normalized"><tspan x="200" y="802">Compatible</tspan> <tspan x="200" y="836">accumulation</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="normalized"><tspan x="200" y="870">Facts and locales</tspan></text>

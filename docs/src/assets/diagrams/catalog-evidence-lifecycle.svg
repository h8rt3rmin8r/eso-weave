<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="install"><tspan x="200" y="1532">Automatic</tspan> <tspan x="200" y="1566">activation</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="install"><tspan x="200" y="1600">Eligible root</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="install"><tspan x="200" y="1634">Maintenance on</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="install"><tspan x="200" y="1668">No player</tspan> <tspan x="200" y="1702">acknowledgement</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="install"><tspan x="200" y="1736">Reverify copy</tspan></text>


<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3"><tspan x="200" y="2916">Natural saves to</tspan> <tspan x="200" y="2950">active data</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf"><tspan x="200" y="2994">No manual collection</tspan> <tspan x="200" y="3028">or build</tspan></text>
</svg>

<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="candidate"><tspan x="200" y="1320">Reports redacted</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="candidate"><tspan x="200" y="1354">Rights retained</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="candidate"><tspan x="200" y="1388">Policy gates</tspan></text>


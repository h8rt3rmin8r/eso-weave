<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="pts"><tspan x="200" y="1948">Own evidence</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="pts"><tspan x="200" y="1982">Own selection</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="pts"><tspan x="200" y="2016">No Live promotion</tspan></text>

<rect data-node="selection" data-stage="5" x="20" y="2118" width="360" height="380" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="selection"><tspan x="200" y="2160">Atomic selection</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2194">Read-only version</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2228">Commit per root</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2262">Keep prior</tspan> <tspan x="200" y="2296">generation</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2330">Cancel stale work</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2364">No in-place</tspan> <tspan x="200" y="2398">overwrite</tspan></text>


<svg xmlns="http://www.w3.org/2000/svg" width="400" height="2500" viewBox="0 0 400 2500" role="img" focusable="false" aria-labelledby="catalog-lifecycle-title catalog-lifecycle-desc" data-flow-direction="top-down">
<title id="catalog-lifecycle-title">Catalog evidence lifecycle</title>
<desc id="catalog-lifecycle-desc">Alternative pinned source snapshots or bounded collector captures normalize into a verified immutable review candidate. Live installation needs explicit trusted-origin acknowledgement before atomic selection; PTS is preview only. Explicit rollback reopens the previous verified Live or bundled target. Collector values remain local-only.</desc>
<rect width="400" height="2500" rx="12" fill="#0e1116" stroke="#65758b"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/></marker></defs>
<text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Catalog evidence lifecycle</text>
<rect data-node="sources" data-stage="1" x="20" y="70" width="360" height="230" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text x="200" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Pinned sources</text>
<text x="200" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Alternative input</text>
<text x="200" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Immutable snapshots</text>
<text x="200" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Version, revision and SHA-256</text>
<text x="200" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Declared source rights</text>
<rect data-node="collector" data-stage="1" x="20" y="370" width="360" height="230" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text x="200" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Collector evidence</text>
<text x="200" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Alternative input</text>
<text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Bounded saved capture</text>
<text x="200" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Complete envelope; parsed data</text>
<text x="200" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Local-only values</text>
<path data-edge="sources-normalized" data-from="sources" data-to="normalized" d="M20 185 H10 V775 H20" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<path data-edge="collector-normalized" data-from="collector" data-to="normalized" d="M200 600 V670" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="normalized" data-stage="2" x="20" y="670" width="360" height="200" rx="8" fill="#172b3a" stroke="#2dd4bf" stroke-width="2"/>
<text x="200" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Normalized bundle</text>
<text x="200" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Channel and provenance</text>
<text x="200" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Versions and sources agree</text>
<text x="200" y="814" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Independent Live / PTS</text>
<path data-edge="normalized-candidate" data-from="normalized" data-to="candidate" d="M200 870 V940" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="candidate" data-stage="3" x="20" y="940" width="360" height="230" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text x="200" y="978" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Verified review candidate</text>
<text x="200" y="1016" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Compile, verify, diff + gates</text>
<text x="200" y="1050" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Nine-file immutable candidate</text>
<text x="200" y="1084" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Manifest SHA-256 identity</text>
<text x="200" y="1118" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Reports redacted; rights kept</text>
<path data-edge="candidate-install" data-from="candidate" data-to="install" d="M200 1170 V1240" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<path data-edge="candidate-pts" data-from="candidate" data-to="pts" d="M380 1055 H390 V1660 H380" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="install" data-stage="4" x="20" y="1240" width="360" height="250" rx="8" fill="#172b3a" stroke="#f2b03c" stroke-width="2"/>
<text x="200" y="1278" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Explicit install</text>
<text x="200" y="1316" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Compatible Live only</text>
<text x="200" y="1350" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Origin acknowledged</text>
<text x="200" y="1384" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Separate user action</text>
<text x="200" y="1418" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Integrity is not origin trust</text>
<text x="200" y="1452" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Reverify staged copy</text>
<rect data-node="pts" data-stage="4" x="20" y="1560" width="360" height="200" rx="8" fill="#172b3a" stroke="#f2b03c" stroke-width="2"/>
<text x="200" y="1598" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">PTS preview only</text>
<text x="200" y="1636" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Review artifacts only</text>
<text x="200" y="1670" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">No runtime selection</text>
<text x="200" y="1704" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">No Live promotion</text>
<path data-edge="install-selection" data-from="install" data-to="selection" d="M20 1365 H10 V1955 H20" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="selection" data-stage="5" x="20" y="1830" width="360" height="250" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
<text x="200" y="1868" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Atomic Live selection</text>
<text x="200" y="1906" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Immutable version, read-only</text>
<text x="200" y="1940" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Atomic selection.json commit</text>
<text x="200" y="1974" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Preserve prior Live or bundled</text>
<text x="200" y="2008" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Failure before commit: no change</text>
<text x="200" y="2042" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">No in-place database overwrite</text>
<path data-edge="selection-rollback" data-from="selection" data-to="rollback" d="M200 2080 V2150" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="rollback" data-stage="6" x="20" y="2150" width="360" height="210" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
<text x="200" y="2188" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Explicit rollback</text>
<text x="200" y="2226" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Reverify and reopen prior target</text>
<text x="200" y="2260" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Advance selection generation</text>
<text x="200" y="2294" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Keep accepted versions immutable</text>
<text x="200" y="2410" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Building never activates data</text>
<text x="200" y="2455" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Images stay in a local cache</text>
</svg>

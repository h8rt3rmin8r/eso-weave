<svg xmlns="http://www.w3.org/2000/svg" width="400" height="3092" viewBox="0 0 400 3092" role="img" focusable="false" aria-labelledby="catalog-evidence-lifecycle-title catalog-evidence-lifecycle-desc" data-flow-direction="top-down">
<title id="catalog-evidence-lifecycle-title">Automatic Catalog evidence flows through compatible accumulation and verification to atomic activation, with independent Live and PTS contexts and retained recovery</title>
<desc id="catalog-evidence-lifecycle-desc">Automatic bounded collection and natural ESO saves feed compatible evidence accumulation. Verification precedes automatic atomic activation. Live and PTS stay independent. Disable or failure preserves the last usable generation; retries need no player action.</desc>
<rect width="400" height="3092" rx="12" fill="#0e1116" stroke="#65758b"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/></marker></defs>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3"><tspan x="200" y="34">Catalog evidence</tspan> <tspan x="200" y="68">lifecycle</tspan></text>
<rect data-node="sources" data-stage="1" x="20" y="132" width="360" height="244" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="sources"><tspan x="200" y="168">Packaged baseline</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="sources"><tspan x="200" y="202">Starting data</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="sources"><tspan x="200" y="236">Pinned source evidence</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="sources"><tspan x="200" y="270">Exact version, rights</tspan></text>

<rect data-node="collector" data-stage="1" x="20" y="446" width="360" height="244" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="collector"><tspan x="200" y="482">Automatic collection</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="collector"><tspan x="200" y="516">Game API definitions</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="collector"><tspan x="200" y="550">Complete saved data</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="collector"><tspan x="200" y="584">ESO controls disk saves</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="collector"><tspan x="200" y="618">Local-only values</tspan></text>

<rect data-node="normalized" data-stage="2" x="20" y="760" width="360" height="210" rx="8" fill="#172b3a" stroke="#2dd4bf" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="normalized"><tspan x="200" y="796">Compatible accumulation</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="normalized"><tspan x="200" y="830">Keep facts and locales</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="normalized"><tspan x="200" y="864">Evidence lineage</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="normalized"><tspan x="200" y="898">Independent Live / PTS</tspan></text>

<rect data-node="candidate" data-stage="3" x="20" y="1040" width="360" height="380" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="candidate"><tspan x="200" y="1076">Verified generation</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="candidate"><tspan x="200" y="1110">Compile, verify, diff</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="candidate"><tspan x="200" y="1144">Immutable artifacts</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="candidate"><tspan x="200" y="1178">Manifest SHA-256</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="candidate"><tspan x="200" y="1212">Reports redacted</tspan> <tspan x="200" y="1246">Rights retained</tspan> <tspan x="200" y="1280">Policy gates</tspan></text>

<rect data-node="install" data-stage="4" x="20" y="1490" width="360" height="278" rx="8" fill="#172b3a" stroke="#f2b03c" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="install"><tspan x="200" y="1526">Automatic activation</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="install"><tspan x="200" y="1560">Eligible combined root</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="install"><tspan x="200" y="1594">Maintenance enabled</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="install"><tspan x="200" y="1628">No player</tspan> <tspan x="200" y="1662">acknowledgement</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="install"><tspan x="200" y="1696">Reverify staged copy</tspan></text>

<rect data-node="pts" data-stage="4" x="20" y="1838" width="360" height="176" rx="8" fill="#172b3a" stroke="#f2b03c" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="pts"><tspan x="200" y="1874">Independent PTS work</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="pts"><tspan x="200" y="1908">Own evidence, selection</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="pts"><tspan x="200" y="1942">No Live promotion</tspan></text>

<rect data-node="selection" data-stage="5" x="20" y="2084" width="360" height="414" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="selection"><tspan x="200" y="2120">Atomic selection</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2154">Read-only version</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2188">Commit per root</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2222">Keep prior generation</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2256">Cancel stale work first</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="selection"><tspan x="200" y="2290">No in-place overwrite</tspan></text>

<rect data-node="rollback" data-stage="6" x="20" y="2568" width="360" height="278" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="rollback"><tspan x="200" y="2604">Retry and recovery</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="rollback"><tspan x="200" y="2638">Keep last usable target</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="rollback"><tspan x="200" y="2672">Reuse semantic no-op</tspan></text>
<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf" data-label-node="rollback"><tspan x="200" y="2706">Retain earlier versions</tspan></text>


<svg xmlns="http://www.w3.org/2000/svg" width="400" height="3092" viewBox="0 0 400 3092" role="img" focusable="false" aria-labelledby="catalog-evidence-lifecycle-title catalog-evidence-lifecycle-desc" data-flow-direction="top-down">
<title id="catalog-evidence-lifecycle-title">Automatic Catalog evidence flows through compatible accumulation and verification to atomic activation, with independent Live and PTS contexts and retained recovery</title>
<desc id="catalog-evidence-lifecycle-desc">Automatic bounded collection and natural ESO saves feed compatible evidence accumulation. Verification precedes automatic atomic activation. Live and PTS stay independent. Disable or failure preserves the last usable generation; retries need no player action.</desc>
<rect width="400" height="3092" rx="12" fill="#0e1116" stroke="#65758b"/>

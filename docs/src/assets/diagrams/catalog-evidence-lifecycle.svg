<text text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3" data-label-node="candidate"><tspan x="200" y="1116">Verified</tspan> <tspan x="200" y="1150">generation</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="2440" viewBox="0 0 400 2440" role="img" focusable="false" aria-labelledby="local-authority-title local-authority-desc" data-flow-direction="top-down">
<title id="local-authority-title">One service, shared authorities</title>
<desc id="local-authority-desc">Local clients locate endpoints through non-secret discovery and copy a bearer credential separately. One loopback service generation guards every request. HTTP and MCP frame shared canonical state and bounded read-only queries over application-selected catalog and encounters, with no gameplay-action authority.</desc>
<rect width="400" height="2440" rx="12" fill="#0e1116" stroke="#65758b"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/></marker></defs>
<text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">One service, shared authorities</text>
<rect data-node="client" data-stage="1" x="20" y="70" width="360" height="230" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text x="200" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Local client</text>
<text x="200" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Discovery: no credential</text>
<text x="200" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Endpoints, process, generation</text>
<text x="200" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Copied bearer credential</text>
<text x="200" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Copy separately from Settings</text>
<path data-edge="client-service" data-from="client" data-to="service" d="M200 300 V370" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="service" data-stage="2" x="20" y="370" width="360" height="230" rx="8" fill="#172b3a" stroke="#f2b03c" stroke-width="2"/>
<text x="200" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">One loopback generation</text>
<text x="200" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Bearer on every request</text>
<text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Exact effective Host</text>
<text x="200" y="514" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Matching optional Origin</text>
<text x="200" y="548" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">One listener and owner</text>
<path data-edge="service-http" data-from="service" data-to="http" d="M200 600 V670" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<path data-edge="service-mcp" data-from="service" data-to="mcp" d="M380 485 H390 V1020 H380" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="http" data-stage="3" x="20" y="670" width="360" height="170" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text x="200" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">HTTP /api/v1</text>
<text x="200" y="746" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">JSON operations</text>
<text x="200" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">HTTP status framing</text>
<rect data-node="mcp" data-stage="3" x="20" y="910" width="360" height="170" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text x="200" y="948" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">MCP /mcp</text>
<text x="200" y="986" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Stateless Streamable HTTP</text>
<text x="200" y="1020" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Resources and query tool</text>
<path data-edge="http-shared" data-from="http" data-to="shared" d="M20 755 H10 V1235 H20" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<path data-edge="mcp-shared" data-from="mcp" data-to="shared" d="M200 1080 V1150" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="shared" data-stage="4" x="20" y="1150" width="360" height="170" rx="8" fill="#172b3a" stroke="#2dd4bf" stroke-width="2"/>
<text x="200" y="1188" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Shared canonical authorities</text>
<text x="200" y="1226" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Same semantics</text>
<text x="200" y="1260" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Different envelopes</text>
<text x="200" y="1294" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">No transport-owned state</text>
<path data-edge="shared-state" data-from="shared" data-to="state" d="M200 1320 V1390" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<path data-edge="shared-query" data-from="shared" data-to="query" d="M380 1235 H390 V1830 H380" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="state" data-stage="5" x="20" y="1390" width="360" height="230" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
<text x="200" y="1428" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Canonical player state</text>
<text x="200" y="1466" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">One snapshot publisher</text>
<text x="200" y="1500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Capabilities + observations</text>
<text x="200" y="1534" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Revision + generation</text>
<text x="200" y="1568" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Knowledge + freshness</text>
<rect data-node="query" data-stage="5" x="20" y="1690" width="360" height="260" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
<text x="200" y="1728" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Shared query executor</text>
<text x="200" y="1766" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Inventory + one read-only query</text>
<text x="200" y="1800" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Shared 2 permits, 2 seconds</text>
<text x="200" y="1834" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">1000 rows, 1 MiB result</text>
<text x="200" y="1868" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">One parameterized statement</text>
<text x="200" y="1902" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Common limits and errors</text>
<path data-edge="query-databases" data-from="query" data-to="databases" d="M200 1950 V2020" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#arrow)"/>
<rect data-node="databases" data-stage="6" x="20" y="2020" width="360" height="260" rx="8" fill="#172b3a" stroke="#60a5fa" stroke-width="2"/>
<text x="200" y="2058" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Fixed catalog and encounters</text>
<text x="200" y="2096" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Application-selected paths</text>
<text x="200" y="2130" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Unavailable identity stays listed</text>
<text x="200" y="2164" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Typed results materialized</text>
<text x="200" y="2198" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">SQL handles closed before</text>
<text x="200" y="2232" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Transport serialization</text>
<text x="200" y="2330" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#e6edf3">Read-only, no actions</text>
<text x="200" y="2370" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">No remote or arbitrary paths</text>
<text x="200" y="2410" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#b8c2cf">Rediscover on generation change</text>
</svg>

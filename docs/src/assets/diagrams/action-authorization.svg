<svg xmlns="http://www.w3.org/2000/svg" width="400" height="950" viewBox="0 0 400 950" role="img" focusable="false" aria-labelledby="action-authorization-title action-authorization-desc" data-flow-direction="top-down">
  <title id="action-authorization-title">Action authorization gate flow</title>
  <desc id="action-authorization-desc">A physical event may pass through or enter bounded handoff. Generated actions require every current positive gate. Unsafe or unavailable evidence fails closed.</desc>
  <rect width="400" height="950" rx="12" fill="#0e1116" stroke="#65758b"/>
  <defs>
    <marker id="authorization-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/>
    </marker>
  </defs>
  <text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">Generated input needs proof</text>

  <rect data-node="physical-event" data-stage="1" x="70" y="70" width="260" height="64" rx="8" fill="#1c2530" stroke="#2dd4bf"/>
  <text x="200" y="109" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Physical event</text>
  <path data-edge="event-to-focus" data-from="physical-event" data-to="focus-decision" d="M200 134 V210" stroke="#f2b03c" stroke-width="3" marker-end="url(#authorization-arrow)"/>

  <rect data-node="focus-decision" data-stage="2" x="70" y="210" width="260" height="80" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="200" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Focus-scoped decision</text>
  <text x="200" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Pass through or bounded handoff</text>
  <path data-edge="focus-to-gates" data-from="focus-decision" data-to="positive-gates" d="M200 290 V375" stroke="#f2b03c" stroke-width="3" marker-end="url(#authorization-arrow)"/>

  <rect data-node="positive-gates" data-stage="3" x="60" y="375" width="280" height="120" rx="8" fill="#1c2530" stroke="#f2b03c" stroke-width="2"/>
  <text x="200" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Positive gates</text>
  <text x="200" y="437" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Current epoch, focus, runtime</text>
  <text x="200" y="461" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">menu, life, world, travel</text>
  <text x="200" y="483" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">and feature prerequisites</text>

  <path data-edge="gates-no" data-from="positive-gates" data-to="fails-closed" data-branch="true" d="M60 435 H28 V570 H95 V620" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#authorization-arrow)"/>
  <text data-edge-label="gates-no" x="45" y="535" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f87171">No</text>
  <path data-edge="gates-yes" data-from="positive-gates" data-to="authorized" data-branch="true" d="M270 495 V550 H295 V620" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#authorization-arrow)"/>
  <text data-edge-label="gates-yes" x="312" y="540" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#34d399">Yes</text>

  <rect data-node="fails-closed" data-stage="4" x="20" y="620" width="150" height="110" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="95" y="657" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f7c3c3">Fails closed</text>
  <text x="95" y="686" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Pass through,</text>
  <text x="95" y="711" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">cancel, or wait</text>
  <rect data-node="authorized" data-stage="4" x="210" y="620" width="170" height="110" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
  <text x="295" y="669" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Authorized</text>
  <text x="295" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Emit bounded action</text>

  <path data-edge="closed-to-no-replay" data-from="fails-closed" data-to="no-replay" d="M95 730 V790 H175 V840" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#authorization-arrow)"/>
  <path data-edge="authorized-to-no-replay" data-from="authorized" data-to="no-replay" d="M295 730 V805 H225 V840" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#authorization-arrow)"/>
  <rect data-node="no-replay" data-stage="5" x="70" y="840" width="260" height="72" rx="8" fill="#151b23" stroke="#65758b"/>
  <text x="200" y="883" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3">Never replay cancelled work</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="930" viewBox="0 0 400 930" role="img" focusable="false" aria-labelledby="safety-recovery-title safety-recovery-desc" data-flow-direction="top-down">
  <title id="safety-recovery-title">Safety recovery ordering</title>
  <desc id="safety-recovery-desc">Unsafe evidence closes shared gates first. Consumers synchronize and a complete baseline is republished while authorization remains closed. Only then may gates reopen.</desc>
  <rect width="400" height="930" rx="12" fill="#0e1116" stroke="#65758b"/>
  <defs>
    <marker id="recovery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/>
    </marker>
  </defs>
  <text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">Close before recovery</text>

  <rect data-node="unsafe-evidence" data-stage="1" x="55" y="70" width="290" height="80" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="200" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#f7c3c3">Unsafe evidence</text>
  <text x="200" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Lost, corrupt, stale, or unknown</text>
  <path data-edge="unsafe-to-close" data-from="unsafe-evidence" data-to="close-gates" d="M200 150 V240" stroke="#f2b03c" stroke-width="3" marker-end="url(#recovery-arrow)"/>

  <rect data-node="close-gates" data-stage="2" x="55" y="240" width="290" height="82" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="200" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#f7c3c3">Close gates</text>
  <text x="200" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Drop or cancel unsafe work</text>
  <path data-edge="close-to-synchronize" data-from="close-gates" data-to="synchronize" d="M200 322 V415" stroke="#f2b03c" stroke-width="3" marker-end="url(#recovery-arrow)"/>

  <rect data-node="synchronize" data-stage="3" x="55" y="415" width="290" height="82" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="200" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Synchronize</text>
  <text x="200" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Engines and controllers stay closed</text>
  <path data-edge="synchronize-to-baseline" data-from="synchronize" data-to="republish-baseline" d="M200 497 V590" stroke="#f2b03c" stroke-width="3" marker-end="url(#recovery-arrow)"/>

  <rect data-node="republish-baseline" data-stage="4" x="55" y="590" width="290" height="86" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="200" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Republish baseline</text>
  <text x="200" y="653" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">All required values are coherent</text>
  <path data-edge="baseline-to-reopen" data-from="republish-baseline" data-to="reopen" d="M200 676 V770" stroke="#f2b03c" stroke-width="3" marker-end="url(#recovery-arrow)"/>

  <rect data-node="reopen" data-stage="5" x="55" y="770" width="290" height="86" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
  <text x="200" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Reopen</text>
  <text x="200" y="833" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Only positively safe gates</text>
  <text x="200" y="902" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f2b03c">No stale work resumes</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="860" viewBox="0 0 400 860" role="img" focusable="false" aria-labelledby="architecture-ownership-title architecture-ownership-desc" data-flow-direction="top-down">
  <title id="architecture-ownership-title">Architecture ownership flow</title>
  <desc id="architecture-ownership-desc">Physical input and observed evidence travel through separate owners. Named consumers combine only the evidence they own, and platform synthesis occurs only after authorization.</desc>
  <rect width="400" height="860" rx="12" fill="#0e1116" stroke="#65758b"/>
  <defs>
    <marker id="architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/>
    </marker>
  </defs>
  <text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">Separate evidence paths</text>

  <rect data-node="physical-input" data-stage="1" x="20" y="70" width="170" height="76" rx="8" fill="#151b23" stroke="#2dd4bf"/>
  <text x="105" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Physical input</text>
  <text x="105" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Keyboard event</text>
  <rect data-node="observed-evidence" data-stage="1" x="210" y="70" width="170" height="76" rx="8" fill="#151b23" stroke="#2dd4bf"/>
  <text x="295" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Observed evidence</text>
  <text x="295" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Process and pixels</text>

  <path data-edge="physical-to-engine" data-from="physical-input" data-to="input-engine" d="M105 146 V220" stroke="#f2b03c" stroke-width="3" marker-end="url(#architecture-arrow)"/>
  <path data-edge="evidence-to-reader" data-from="observed-evidence" data-to="pixel-bus-reader" d="M295 146 V220" stroke="#f2b03c" stroke-width="3" marker-end="url(#architecture-arrow)"/>

  <rect data-node="input-engine" data-stage="2" x="20" y="220" width="170" height="82" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="105" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Input Engine</text>
  <text x="105" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Pass or hand off</text>
  <rect data-node="pixel-bus-reader" data-stage="2" x="210" y="220" width="170" height="82" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="295" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Pixel Bus Reader</text>
  <text x="295" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Validate and publish</text>

  <path data-edge="engine-to-consumers" data-from="input-engine" data-to="named-consumers" d="M105 302 V342 H180 V390" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#architecture-arrow)"/>
  <path data-edge="reader-to-consumers" data-from="pixel-bus-reader" data-to="named-consumers" d="M295 302 V352 H220 V390" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#architecture-arrow)"/>

  <rect data-node="named-consumers" data-stage="3" x="45" y="390" width="310" height="94" rx="8" fill="#1c2530" stroke="#f2b03c" stroke-width="2"/>
  <text x="200" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Named consumers</text>
  <text x="200" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Weave Engine and controllers</text>
  <text x="200" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">apply only their owned policy</text>

  <path data-edge="consumers-to-authorized" data-from="named-consumers" data-to="authorized-action" d="M200 484 V570" stroke="#f2b03c" stroke-width="3" marker-end="url(#architecture-arrow)"/>
  <rect data-node="authorized-action" data-stage="4" x="55" y="570" width="290" height="82" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
  <text x="200" y="603" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Authorized action only</text>
  <text x="200" y="629" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Bounded worker handoff</text>

  <path data-edge="authorized-to-platform" data-from="authorized-action" data-to="platform-synthesis" d="M200 652 V740" stroke="#f2b03c" stroke-width="3" marker-end="url(#architecture-arrow)"/>
  <rect data-node="platform-synthesis" data-stage="5" x="70" y="740" width="260" height="64" rx="8" fill="#151b23" stroke="#65758b"/>
  <text x="200" y="779" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Platform synthesis</text>
  <text x="200" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f2b03c">Separate owners, one explicit handoff</text>
</svg>

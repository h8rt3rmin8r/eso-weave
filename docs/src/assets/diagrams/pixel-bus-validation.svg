<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1080" viewBox="0 0 400 1080" role="img" focusable="false" aria-labelledby="pixel-bus-validation-title pixel-bus-validation-desc" data-flow-direction="top-down">
  <title id="pixel-bus-validation-title">Pixel Bus layered validation</title>
  <desc id="pixel-bus-validation-desc">The reader captures one displayed frame and validates its header and layout before sampling payload. A missing heartbeat causes signal loss. Each payload block then validates independently, so one malformed block follows its signal-specific unavailable or hold behavior while other valid blocks can publish.</desc>
  <rect width="400" height="1080" rx="12" fill="#0e1116" stroke="#65758b"/>
  <defs>
    <marker id="pixel-bus-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/>
    </marker>
  </defs>
  <text x="200" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">Layered validation</text>

  <rect data-node="capture-frame" data-stage="1" x="65" y="65" width="270" height="64" rx="8" fill="#1c2530" stroke="#2dd4bf"/>
  <text x="200" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Capture one frame</text>
  <path data-edge="capture-to-header" data-from="capture-frame" data-to="validate-header" d="M200 129 V210" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>

  <rect data-node="validate-header" data-stage="2" x="55" y="210" width="290" height="84" rx="8" fill="#1c2530" stroke="#f2b03c" stroke-width="2"/>
  <text x="200" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Validate header and layout</text>
  <text x="200" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Magic, version, geometry, extent</text>

  <path data-edge="header-invalid" data-from="validate-header" data-to="suppress-all" data-branch="true" d="M55 252 H28 V360 H80 V410" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text data-edge-label="header-invalid" x="45" y="337" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f87171">Invalid</text>
  <path data-edge="header-valid" data-from="validate-header" data-to="heartbeat" data-branch="true" d="M250 294 V340 H285 V400" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text data-edge-label="header-valid" x="302" y="366" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Valid</text>

  <rect data-node="suppress-all" data-stage="3" x="15" y="410" width="130" height="100" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="80" y="444" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f7c3c3">Suppress all</text>
  <text x="80" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">payload sampling</text>
  <text x="80" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Layout unavailable</text>
  <rect data-node="heartbeat" data-stage="3" x="175" y="400" width="210" height="90" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="280" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Require B0 heartbeat</text>
  <text x="280" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Apply bounded timeout</text>

  <path data-edge="heartbeat-timeout" data-from="heartbeat" data-to="signal-lost" data-branch="true" d="M335 490 V530 H300 V570" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text data-edge-label="heartbeat-timeout" x="318" y="515" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f87171">Timed out</text>
  <path data-edge="heartbeat-present" data-from="heartbeat" data-to="decode-blocks" data-branch="true" d="M230 490 V530 H125 V570" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text data-edge-label="heartbeat-present" x="142" y="555" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Present</text>

  <rect data-node="decode-blocks" data-stage="4" x="15" y="570" width="200" height="105" rx="8" fill="#1c2530" stroke="#f2b03c" stroke-width="2"/>
  <text x="115" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">Decode blocks independently</text>
  <text x="115" y="635" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Marker, complement, value</text>
  <text x="115" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">from one captured frame</text>
  <rect data-node="signal-lost" data-stage="4" x="235" y="570" width="150" height="105" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="310" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f7c3c3">Signal Lost</text>
  <text x="310" y="637" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Clear authorizing</text>
  <text x="310" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">observations</text>

  <path data-edge="block-malformed" data-from="decode-blocks" data-to="signal-specific" data-branch="true" d="M70 675 V710 H90 V765" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text data-edge-label="block-malformed" x="108" y="735" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f87171">Malformed</text>
  <path data-edge="block-valid" data-from="decode-blocks" data-to="publish-observation" data-branch="true" d="M170 675 V725 H297 V765" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text data-edge-label="block-valid" x="280" y="710" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Valid block</text>

  <rect data-node="signal-specific" data-stage="5" x="15" y="765" width="155" height="115" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="92.5" y="801" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f7c3c3">Signal-specific</text>
  <text x="92.5" y="829" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">unavailable or hold</text>
  <text x="92.5" y="857" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Other blocks continue</text>
  <rect data-node="publish-observation" data-stage="5" x="210" y="765" width="175" height="100" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
  <text x="297.5" y="806" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Publish observation</text>
  <text x="297.5" y="837" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Only when value changes</text>

  <path data-edge="signal-specific-to-route" data-from="signal-specific" data-to="route-consumers" d="M90 880 V900 H170 V920" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <path data-edge="publish-to-route" data-from="publish-observation" data-to="route-consumers" d="M297 865 V905 H230 V920" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <rect data-node="route-consumers" data-stage="6" x="65" y="920" width="270" height="80" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="200" y="954" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Route consumers</text>
  <text x="200" y="981" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Preserve each signal's scope</text>
  <text x="200" y="1050" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f2b03c">Fresh recovery republishes a full baseline</text>
</svg>

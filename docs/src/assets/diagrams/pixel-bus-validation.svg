<svg xmlns="http://www.w3.org/2000/svg" width="400" height="820" viewBox="0 0 400 820" role="img" focusable="false" aria-labelledby="pixel-bus-validation-title pixel-bus-validation-desc" data-flow-direction="top-down">
  <title id="pixel-bus-validation-title">Pixel Bus layered validation</title>
  <desc id="pixel-bus-validation-desc">The reader captures one displayed frame and validates its header and layout before sampling payload. A missing heartbeat causes signal loss. Each payload block then validates independently, so one malformed block follows its signal-specific unavailable or hold behavior while other valid blocks can publish.</desc>
  <rect width="400" height="820" rx="12" fill="#0e1116" stroke="#65758b"/>
  <defs>
    <marker id="pixel-bus-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/>
    </marker>
  </defs>
  <text x="200" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">Layered validation</text>
  <rect x="65" y="54" width="270" height="60" rx="8" fill="#1c2530" stroke="#2dd4bf"/>
  <text x="200" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Capture one frame</text>
  <path d="M200 114 V148" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <rect x="65" y="160" width="270" height="76" rx="8" fill="#1c2530" stroke="#f2b03c" stroke-width="2"/>
  <text x="200" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Validate header and layout</text>
  <text x="200" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Magic, version, geometry, extent</text>
  <path d="M65 198 H30 V258" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text x="34" y="188" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f87171">Invalid</text>
  <rect x="15" y="270" width="130" height="88" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="80" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f7c3c3">Suppress all</text>
  <text x="80" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">payload sampling</text>
  <text x="80" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Layout unavailable</text>
  <path d="M200 236 V250 H275 V258" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text x="213" y="247" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Valid</text>
  <rect x="165" y="270" width="220" height="78" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="275" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Require B0 heartbeat</text>
  <text x="275" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Apply the bounded timeout</text>
  <path d="M330 348 V376" stroke="#f87171" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text x="324" y="370" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f87171">Timed out</text>
  <rect x="255" y="388" width="130" height="94" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="320" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f7c3c3">Signal Lost</text>
  <text x="320" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Clear authorizing</text>
  <text x="320" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">observations</text>
  <path d="M220 348 V364 H125 V376" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text x="132" y="359" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Present</text>
  <rect x="15" y="388" width="220" height="94" rx="8" fill="#1c2530" stroke="#f2b03c" stroke-width="2"/>
  <text x="125" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e6edf3">Decode blocks independently</text>
  <text x="125" y="443" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Marker, complement, value rules</text>
  <text x="125" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">One captured frame</text>
  <path d="M125 482 V506" stroke="#f87171" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text x="18" y="500" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f87171">Malformed</text>
  <rect x="15" y="518" width="130" height="112" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="80" y="547" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f7c3c3">Signal-specific</text>
  <text x="80" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">unavailable or hold</text>
  <text x="80" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Other valid blocks</text>
  <text x="80" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">continue</text>
  <path d="M180 482 V494 H275 V506" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text x="188" y="490" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Valid block</text>
  <rect x="165" y="518" width="220" height="88" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
  <text x="275" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Publish observation</text>
  <text x="275" y="578" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Only when its value changes</text>
  <path d="M80 630 V650 H200 V665" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <path d="M275 606 V640 H200 V665" fill="none" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <rect x="65" y="677" width="270" height="70" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="200" y="708" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Route consumers</text>
  <text x="200" y="733" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Preserve each signal's scope</text>
  <text x="200" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f2b03c">Fresh recovery republishes a full baseline</text>
</svg>

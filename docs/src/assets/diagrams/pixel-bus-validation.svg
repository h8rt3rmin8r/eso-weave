<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 720" role="img" focusable="false" aria-labelledby="pixel-bus-validation-title pixel-bus-validation-desc" data-flow-direction="top-down">
  <title id="pixel-bus-validation-title">Pixel Bus frame validation</title>
  <desc id="pixel-bus-validation-desc">The reader captures one displayed frame, validates its complete header, and decodes payload from that same frame. Missing or corrupt evidence invalidates state. Only a validated frame reaches consumers.</desc>
  <rect width="400" height="720" rx="12" fill="#0e1116" stroke="#65758b"/>
  <defs>
    <marker id="pixel-bus-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#f2b03c"/>
    </marker>
  </defs>
  <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e6edf3">One frame, one decision</text>
  <rect x="65" y="60" width="270" height="62" rx="8" fill="#1c2530" stroke="#2dd4bf"/>
  <text x="200" y="97" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Capture one frame</text>
  <path d="M200 122 V164" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <rect x="65" y="176" width="270" height="84" rx="8" fill="#1c2530" stroke="#f2b03c" stroke-width="2"/>
  <text x="200" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Validate header</text>
  <text x="200" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Magic, version, layout, extent</text>
  <text x="200" y="251" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">and heartbeat status</text>
  <path d="M65 218 H34 V390" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text x="41" y="206" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f87171">No</text>
  <path d="M200 260 V304" stroke="#34d399" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <text x="210" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#34d399">Valid</text>
  <rect x="65" y="316" width="270" height="70" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="200" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Decode payload</text>
  <text x="200" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Use the same captured frame</text>
  <rect x="18" y="402" width="132" height="108" rx="8" fill="#3a1d22" stroke="#f87171" stroke-width="2"/>
  <text x="84" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f7c3c3">Invalidate</text>
  <text x="84" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Suppress payload</text>
  <text x="84" y="481" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">or signal loss</text>
  <text x="84" y="502" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#e6edf3">Fails closed</text>
  <path d="M200 386 V430" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <rect x="170" y="442" width="212" height="82" rx="8" fill="#1c2530" stroke="#65758b"/>
  <text x="276" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e6edf3">Close before routing</text>
  <text x="276" y="496" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Synchronize safe state</text>
  <path d="M276 524 V570" stroke="#f2b03c" stroke-width="3" marker-end="url(#pixel-bus-arrow)"/>
  <rect x="65" y="582" width="270" height="72" rx="8" fill="#153329" stroke="#34d399" stroke-width="2"/>
  <text x="200" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#e6edf3">Route consumers</text>
  <text x="200" y="636" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#b8c2cf">Publish changed observations</text>
  <text x="200" y="689" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f2b03c">Recovery republishes a full baseline</text>
</svg>
